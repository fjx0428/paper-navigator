<script>
const DATA = {"notes":[{"arxiv_id":"1706.03762","title":"Attention Is All You Need","problem":{"text":"序列转导任务的主流做法是编码器-解码器结构的循环或卷积神经网络，其中 RNN 按符号位置逐步展开隐藏状态，这种固有的时序性使单个训练样本内部无法并行，序列越长越受显存与批大小限制。注意力机制通常只是与循环网络配合使用的辅助组件。本文的问题是：能否完全去掉循环与卷积，仅靠注意力在输入输出之间建立全局依赖，同时获得更好的翻译质量和更高的训练并行度。","quotes":["The dominant sequence transduction models are based on complex recurrent or convolutional neural networks in an encoder-decoder configuration.","We propose a new simple network architecture, the Transformer, based solely on attention mechanisms, dispensing with recurrence and convolutions entirely.","This inherently sequential nature precludes parallelization within training examples"]},"method":{"text":"Transformer 由 6 层编码器与 6 层解码器堆叠而成，每层以多头自注意力加逐位置全连接前馈网络为核心，并采用残差连接加层归一化；解码器额外插入对编码器输出的注意力，并用掩码保证自回归性质。核心算子是缩放点积注意力 softmax(QK^T/√d_k)V，多头机制用 h=8 组独立线性投影在不同于空间并行做注意力再拼接，总计算量与全维单头相当。模型用正弦余弦位置编码注入顺序信息，并在嵌入层与 pre-softmax 线性层之间共享权重矩阵。","quotes":["The encoder is composed of a stack of N = 6 identical layers.","In this work we employ h = 8 parallel attention layers, or heads.","Multi-head attention allows the model to jointly attend to information from different representation subspaces at different positions.","In this work, we use sine and cosine functions of different frequencies"]},"data":{"text":"机器翻译实验使用 WMT 2014 英德（约 450 万句对，共享约 37000 的 BPE 词表）与英法（3600 万句，32000 word-piece 词表）数据集，按长度分桶，每批约 25000 源端与 25000 目标端 token。训练在单机 8 块 NVIDIA P100 上完成：base 模型 10 万步约 12 小时，big 模型 30 万步约 3.5 天。为验证泛化性，作者另在 Penn Treebank 的 WSJ 子集（约 4 万句）上做英语成分句法分析，并在约 1700 万句的半监督语料上训练。","quotes":["We trained on the standard WMT 2014 English-German dataset consisting of about 4.5 million sentence pairs.","For English-French, we used the significantly larger WMT 2014 English-French dataset consisting of 36M sentences and split tokens into a 32000 word-piece vocabulary","We trained our models on one machine with 8 NVIDIA P100 GPUs.","We trained a 4-layer transformer with dmodel = 1024 on the Wall Street Journal (WSJ) portion of the Penn Treebank"]},"limitations":{"text":"自注意力每层复杂度为 O(n^2·d)，序列很长时计算与显存开销随长度平方增长，作者只是提出可把注意力限制在大小为 r 的邻域并留作未来工作。验证范围集中在机器翻译与英语成分句法分析两类任务，句法分析上仍未超过 Recurrent Neural Network Grammar，且文本之外的模态尚未实验。原文也没有报告多次运行的方差或对超参（层数、头数、dropout）之外因素的鲁棒性分析。","quotes":["To improve computational performance for tasks involving very long sequences, self-attention could be restricted to considering only a neighborhood of size r in the input sequence centered around the respective output position.","We plan to extend the Transformer to problems involving input and output modalities other than text and to investigate local, restricted attention mechanisms to efficiently handle large inputs and outputs such as images, audio and video.","yielding better results than all previously reported models with the exception of the Recurrent Neural Network Grammar [8]."]},"metrics":[{"name":"WMT 2014 EN-DE BLEU (big)","value":"28.4","quote":"establishing a new state-of-the-art BLEU score of 28.4"},{"name":"WMT 2014 EN-FR BLEU (single model)","value":"41.8","quote":"our model establishes a new single-model state-of-the-art BLEU score of 41.8 after training for 3.5 days on eight GPUs"},{"name":"WSJ Section 23 F1 (4-layer, semi-supervised)","value":"92.7","quote":"Transformer (4 layers) semi-supervised 92.7"},{"name":"Base model training steps / time","value":"100,000 steps, 12 hours","quote":"We trained the base models for a total of 100,000 steps or 12 hours."}]},{"arxiv_id":"1706.06978","data":{"quotes":["Experiments on two public datasets as well as an Alibaba real production dataset with over 2 billion samples","more relevant to online performance in display advertising system."],"text":"实验使用两个公开数据集（Amazon Electronics 与 MovieLens）以及阿里巴巴展示广告生产日志，其中 Alibaba 训练集约 2 billion 样本、测试集 0.14 billion 样本。指标为按用户展示量加权的 user-weighted AUC（论文仍简称 AUC），并以相对 BaseModel 的 RelaImpr 衡量提升。对比对象包括 LR、BaseModel、Wide&Deep、PNN、DeepFM，并在 Alibaba 数据上对 Dropout、Filter、DiFacto、MBA 等正则化与 Dice 激活函数做消融。"},"limitations":{"quotes":["on Amazon Dataset with rich user behaviors, DIN stands out","which leads to extremely heavy computations and is unacceptable with parameters scaling up to hundreds of millions","DIN now has been deployed in the online display advertising system in Alibaba."],"text":"证据以离线 AUC 为主，公开数据集上的增益有限（Amazon 5.35%、MovieLens 1.61%），且收益明显集中在行为丰富的场景，说明效果依赖历史行为的质量与规模。方法需对每个候选广告与全部历史行为逐一打分，在线时延与算力开销未被量化；正则化与 Dice 的动机也表明，工业级稀疏特征训练的开销才是主要工程约束。"},"method":{"quotes":["a(·) is a feed-forward network with output as the activation weight","in which only parameters of features appearing in m-th mini-batch participate in the computation of regularization.","we develop two techniques: mini-batch aware regularization and data adaptive activation function which can help training industrial deep networks with hundreds of millions of parameters"],"text":"DIN 在 BaseModel 上仅增加一个 local activation unit：以候选广告 embedding 与每条历史行为 embedding 为输入，经前馈网络输出激活权重，对行为 embedding 做加权 sum pooling，得到随广告变化的用户兴趣表示。为训练上亿参数的稀疏特征网络，论文提出 mini-batch aware 正则化（只对当前 batch 中出现的特征参数计算 L2 惩罚）和数据自适应激活函数 Dice（用 batch 内均值方差自适应调整整流点）。"},"metrics":[{"name":"Amazon Electronics AUC (DIN)","quote":"DIN 0.7337 1.61% 0.8818 5.35%","value":"0.8818"},{"name":"Amazon Electronics RelaImpr (DIN)","quote":"DIN 0.7337 1.61% 0.8818 5.35%","value":"5.35%"},{"name":"Amazon Electronics AUC (DIN + Dice)","quote":"DIN with Dice0.7348 2.09% 0.8871 6.82%","value":"0.8871"},{"name":"Amazon Electronics RelaImpr (DIN + Dice)","quote":"DIN with Dice0.7348 2.09% 0.8871 6.82%","value":"6.82%"},{"name":"Alibaba AUC (DIN with MBA Reg. and Dice)","quote":"DIN with MBA Reg. and Dice 0.6083 11.65%","value":"0.6083"},{"name":"Alibaba RelaImpr (DIN with MBA Reg. and Dice)","quote":"DIN with MBA Reg. and Dice 0.6083 11.65%","value":"11.65%"},{"name":"Alibaba AUC (DIN alone)","quote":"DIN Model 0.6029 6.08%","value":"0.6029"},{"name":"Alibaba AUC (BaseModel with MBA Reg.)","quote":"With goods_ids feature and MBA. Reg. 0.6031 9.68%","value":"0.6031"}],"problem":{"quotes":["This representation vector stays the same for a given user, in regardless of what candidate ads are.","In this way, user features are compressed into a fixed-length representation vector, in regardless of what candidate ads are."],"text":"论文针对展示广告 CTR 预测中 Embedding&MLP 范式的核心缺陷：用户特征被池化为固定长度向量，且该向量与候选广告无关，因此维度受限时成为表达用户多样兴趣的瓶颈。作者指出，直接扩大 embedding 维度会带来过拟合，并显著增加计算与存储负担，对工业在线系统不可接受。"},"title":"Deep Interest Network for Click-Through Rate Prediction"},{"arxiv_id":"1810.04805","data":{"quotes":["We use WordPiece embeddings (Wu et al.,","2016) with a 30,000 token vocabulary. The first","use the BooksCorpus (800M words) (Zhu et al.,","2015) and English Wikipedia (2,500M words).","We use a batch size of 32 and fine-tune for 3","(among 5e-5, 4e-5, 3e-5, and 2e-5) on the Dev set."],"text":"预训练语料为 BooksCorpus（800M 词）与英文 Wikipedia（2,500M 词），只用 WordPiece 切分、词表 30,000，并刻意保留文档级连续文本而非打散的句子。模型分 BERT_BASE（12 层、768 隐层、12 头，110M 参数）与 BERT_LARGE（24 层、1024 隐层、16 头，340M 参数）两档，前者参数量与 OpenAI GPT 对齐以便对比。微调与评测覆盖 11 个 NLP 任务，GLUE 上使用 batch size 32、训练 3 个 epoch，学习率在 5e-5 至 2e-5 之间按 Dev 集选择。"},"limitations":{"quotes":["are creating a mismatch between pre-training and","without fine-tuning, since it was trained with NSP.","was sometimes unstable on small datasets,","best model on the Dev set. With random restarts,"],"text":"MLM 带来预训练与微调的不一致：[MASK] 在微调阶段不会出现，作者只能用 80% 替换为 [MASK]、10% 随机词、10% 保持原词的策略缓解而无法消除。NSP 训练出的 [CLS] 向量在微调之前并不是有意义的句子表示，它只是借助下游任务才获得聚合语义。此外 BERT_LARGE 在小数据集上微调不稳定，需多次随机重启并挑 Dev 最优模型，说明大模型微调对超参和随机性敏感。"},"method":{"quotes":["In order to train a deep bidirectional representa-","we simply mask some percentage of the input","tokens at random, and then predict those masked","we mask 15% of all WordPiece to-","next sentence that follows A (labeled as IsNext),","and 50% of the time it is a random sentence from"],"text":"预训练由两个无监督任务组成。MLM 随机选中 15% 的 WordPiece token 并只预测这些被遮位置：其中 80% 换成 [MASK]、10% 换成随机词、10% 保持原词，以避免 [MASK] 只在预训练出现造成的错配。NSP 以各 50% 的概率判断 B 是 A 的真实下一句（IsNext）还是语料中的随机句（NotNext），用于学习句间关系。输入表示是 token、segment、position 三种 embedding 之和，[CLS] 的最终隐状态作为分类用聚合表示，句对以 [SEP] 分隔；微调时把任务输入输出接入同一 Transformer 端到端训练，仅新增少量参数。"},"metrics":[{"name":"GLUE score","quote":"pushing the GLUE score to 80.5% (7.7% point absolute improvement)","value":"80.5%"},{"name":"MultiNLI accuracy","quote":"MultiNLI accuracy to 86.7% (4.6% absolute improvement)","value":"86.7%"},{"name":"SQuAD v1.1 Test F1","quote":"SQuAD v1.1 question answering Test F1 to 93.2 (1.5 point absolute improvement)","value":"93.2"},{"name":"SQuAD v2.0 Test F1","quote":"SQuAD v2.0 Test F1 to 83.1 (5.1 point absolute improvement)","value":"83.1"},{"name":"BERT_LARGE GLUE average","quote":"BERTLARGE 86.7/85.9 72.1 92.7 94.9 60.5 86.5 89.3 70.1 82.1","value":"82.1"},{"name":"Masking rate","quote":"we mask 15% of all WordPiece to-","value":"15%"},{"name":"Feature-based gap on CoNLL-2003","quote":"0.3 F1 behind fine-tuning the entire model","value":"0.3 F1"}],"problem":{"quotes":["Unlike recent language representation models, BERT is designed to pre-train deep bidirectional representations from unlabeled text by jointly conditioning on both left and right context in all layers.","BERT is conceptually simple and empirically powerful."],"text":"论文针对的是当时语言模型预训练的单向性约束：ELMo 用左右两个独立单向模型的浅层拼接，GPT 只用从左到右的 Transformer，每个 token 无法在每一层同时融合左右上下文。作者指出这种限制对句子级任务次优，对问答这类 token 级任务尤其有害。BERT 的目标是用掩码语言模型实现深层双向预训练，并让同一个预训练模型只加一个输出层就能适配多种下游任务。"},"title":"BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding"},{"arxiv_id":"2005.11401","title":"Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks","problem":{"text":"预训练语言模型把事实知识存在参数里，但难以精确访问和操作这些知识，在知识密集型任务上不如任务专用架构；同时，其决策缺乏可追溯来源，世界知识也难以更新。已有的参数记忆与非参数记忆混合模型（REALM、ORQA）只被用于抽取式下游任务。本文要把这种混合记忆推广到 seq2seq 生成，提出通用的检索增强生成（RAG）微调方案。","quotes":["However, their ability to access and precisely manipulate knowledge is still limited, and hence on knowledge-intensive tasks, their performance lags behind task-specific architectures.","Pre-trained models with a differentiable access mechanism to explicit non-parametric memory can overcome this issue, but have so far been only investigated for extractive downstream tasks.","They cannot easily expand or revise their memory, can’t straightforwardly provide insight into their predictions, and may produce “hallucinations”"]},"method":{"text":"RAG 由两部分组成：检索器 p(z|x) 用 DPR 双编码器在 Wikipedia 稠密向量索引上做 top-K MIPS 检索，生成器 p(y|x,z) 用 BART-large（400M 参数），把输入与检索段落拼接后生成。训练时把检索到的文档当作隐变量，用 top-K 近似做边缘化，检索器与生成器联合微调。作者给出两种形式：RAG-Sequence 对整条输出序列使用同一篇文档，RAG-Token 允许每个目标 token 依据不同文档，因此可以综合多篇文档的内容。","quotes":["To train the retriever and generator end-to-end, we treat the retrieved document as a latent variable.","In the RAG-Token model we can draw a different latent document for each target token and marginalize accordingly.","The retrieval component pη (z|x) is based on DPR [26]. DPR follows a bi-encoder architecture","We use BART-large [32], a pre-trained seq2seq transformer [58] with 400M parameters."]},"data":{"text":"非参数记忆是 2018 年 12 月的 Wikipedia dump，每篇文章切成不重叠的 100 词块，共 21M 篇文档，用 FAISS 建单一 MIPS 索引；训练时检索 top k，k 取 5 或 10，测试时的 k 由 dev 集决定。评测覆盖四个开放域问答数据集（Natural Questions、TriviaQA、WebQuestions、CuratedTrec，报告 Exact Match），以及 MS-MARCO NLG 抽象式问答、Jeopardy 问题生成和 FEVER 事实核查。","quotes":["Each Wikipedia article is split into disjoint 100-word chunks, to make a total of 21M documents.","Following Lee et al. [31] and Karpukhin et al. [26], we use the December 2018 dump.","We consider k ∈ {5, 10} for training and set k for test time using dev data."]},"limitations":{"text":"非参数记忆被限定在 Wikipedia 单一来源，作者也承认并非所有问题都能仅靠 Wikipedia 回答，知识库本身也不可避免带有偏差。检索器并非从零任务无关地学得：它用 DPR 初始化，而 DPR 在 Natural Questions 和 TriviaQA 上接受过检索监督；作者把两个分量能否从零联合预训练列为未来工作。检索并非在所有任务上都优于词重叠基线，FEVER 上 BM25 最好；索引热替换需要重建整个索引，且论文未系统评估检索带来的延迟与算力开销。","quotes":["not all questions are answerable from Wikipedia alone","which uses retrieval supervision on Natural Questions and TriviaQA","In future work, it may be fruitful to investigate if the two components can be jointly pre-trained from scratch","For FEVER, BM25 performs best, perhaps since FEVER claims are heavily entity-centric and thus well-suited for word overlap-based retrieval.","Wikipedia, or any potential external knowledge source, will probably never be entirely factual and completely devoid of bias."]},"metrics":[{"name":"Natural Questions 测试集 Exact Match（RAG-Sequence）","value":"44.5","quote":"RAG-Seq. 44.5 56.8/68.0 45.2 52.2"},{"name":"TriviaQA-Wiki 测试集 Exact Match（RAG-Sequence）","value":"68.0","quote":"RAG-Seq. 44.5 56.8/68.0 45.2 52.2"},{"name":"Open MS-MARCO NLG 相对 BART 的提升","value":"+2.6 BLEU / +2.6 ROUGE-L","quote":"RAG-Sequence outperforms BART on Open MS-MARCO NLG by 2.6 Bleu points and 2.6 Rouge-L points."},{"name":"Jeopardy 人类评估中 RAG 更符合事实的比例","value":"42.7%（BART 更符合事实仅 7.1%）","quote":"BART was more factual than RAG in only 7.1% of cases, while RAG was more factual in 42.7% of cases"},{"name":"NQ 上正确答案不在任何检索文档中仍答对的比例","value":"11.8%","quote":"achieving 11.8% accuracy in such cases for NQ, where an extractive model would score 0%"},{"name":"索引热替换：用 2016 索引回答 2016 世界领导人问题的准确率","value":"70%（2018 索引/2018 领导人 68%）","quote":"RAG answers 70% correctly using the 2016 index for 2016 world leaders and 68% using the 2018 index for 2018 world leaders."}]},{"arxiv_id":"2106.09685","data":{"quotes":["Our experiments cover a wide range of tasks, from natural language understanding (NLU) to generation (NLG).","We use NVIDIA Tesla V100 for all experiments.","As shown in Table 4, LoRA matches or exceeds the fine-tuning baseline on all three datasets.","GPT-3 (LoRA) 4.7M 73.4 91.7 53.8/29.8/45.9"],"text":"实验覆盖 RoBERTa base/large 与 DeBERTa XXL 的 GLUE、GPT-2 medium/large 的 E2E NLG（另含 WebNLG、DART），并扩展到 GPT-3 175B 的 WikiSQL、MultiNLI 与 SAMSum，全部在 NVIDIA Tesla V100 上训练。GPT-3 上 LoRA（4.7M 可训练参数）取得 WikiSQL 73.4、MultiNLI-m 91.7、SAMSum R1/R2/RL 53.8/29.8/45.9，与全量微调的 73.8、89.5、52.0/28.0/44.5 相当或更好。DeBERTa XXL 上 LoRA 仅用 4.7M 参数就把 GLUE 平均分做到 91.3，略高于全量微调的 91.1。"},"limitations":{"quotes":["However, we do not expect a small r to work for every task or dataset.","We mostly depend on heuristics to select the weight matrices to apply LoRA to.","The mechanism behind fine-tuning or LoRA is far from clear – how are features learned during pre-training transformed to do well on downstream tasks?","While a thorough investigation into this phenomenon is out-of-scope for this work"],"text":"“该把 LoRA 加到哪些权重矩阵”以及秩 r 的选取仍主要依赖启发式规则，小秩并非对所有任务都成立，例如下游任务语言与预训练语言不同时，接近满秩的重训练可能更好。低秩有效性的解释主要是经验性的子空间相似度分析，微调/LoRA 起作用的内在机制仍不清楚。实验只覆盖 Transformer 的注意力权重（MLP 被冻结），并且对特殊 token 过多导致性能下降的现象明确未做深入研究。"},"method":{"quotes":["LoRA allows us to train some dense layers in a neural network indirectly by optimizing rank decomposition matrices","In principle, we can apply LoRA to any subset of weight matrices in a neural network to reduce the number of trainable parameters.","We limit our study to only adapting the attention weights for downstream tasks and freeze the MLP modules"],"text":"LoRA 冻结预训练权重 W0，把权重更新重参数化为低秩分解 ΔW=BA（B 为 d×r、A 为 r×k，r 远小于 min(d,k)），前向变成 h=W0x+BAx，只训练 A、B。A 用高斯初始化、B 置零，使训练开始时 ΔW 为零；ΔWx 再按 α/r 缩放，从而在改变 r 时减少超参数重调。推理时把 BA 显式加回 W0，任务切换只需替换低秩矩阵，因此不增加推理延迟；实验主要把 LoRA 施加于注意力的 Wq、Wv，并冻结 MLP。"},"metrics":[{"name":"可训练参数减少倍数（GPT-3 175B）","quote":"Compared to GPT-3 175B fine-tuned with Adam, LoRA can reduce the number of trainable parameters by 10,000 times and the GPU memory requirement by 3 times.","value":"10,000×"},{"name":"GPU 显存需求降低","quote":"LoRA makes training more efficient and lowers the hardware barrier to entry by up to 3 times when using adaptive optimizers since we do not need to calculate the gradients or maintain the optimizer states for most parameters.","value":"3×"},{"name":"GPT-3 WikiSQL 准确率（LoRA，4.7M 参数）","quote":"GPT-3 (LoRA) 4.7M 73.4 91.7 53.8/29.8/45.9","value":"73.4%"},{"name":"GPT-3 MultiNLI-m 准确率（LoRA，4.7M 参数）","quote":"GPT-3 (LoRA) 4.7M 73.4 91.7 53.8/29.8/45.9","value":"91.7%"},{"name":"DeBERTa XXL GLUE 平均分（LoRA，4.7M 参数）","quote":"DeBXXL (LoRA) 4.7M 91.9±.2 96.9±.2 92.6±.6 72.4±1.1 96.0±.1 92.9±.1 94.9±.4 93.0±.2 91.3","value":"91.3"},{"name":"GPT-3 训练吞吐（LoRA vs 全量微调，每 V100）","quote":"For GPT-3 175B, the training throughput for full fine-tuning is 32.5 tokens/s per V100 GPU; with the same number of weight shards for model parallelism, the throughput is 43.1 tokens/s per V100 GPU for LoRA.","value":"43.1 vs 32.5 tokens/s"},{"name":"100 个适配模型的总存储","quote":"storing 100 adapted models only requires 350GB + 35MB * 100 ≈ 354GB as opposed to 100 * 350GB ≈ 35TB.","value":"354GB（vs 35TB）"}],"problem":{"quotes":["Using GPT-3 175B as an example -- deploying independent instances of fine-tuned models, each with 175B parameters, is prohibitively expensive.","As we pre-train larger models, full fine-tuning, which retrains all model parameters, becomes less feasible.","often introduce inference latency (Houlsby et al., 2019; Rebuffi et al., 2017) by extending model depth or reduce the model’s usable sequence length"],"text":"大规模预训练语言模型要为每个下游任务做全量微调，每个任务都要保存并部署一份与原始模型同样大的参数副本；以 GPT-3 175B 为例，这种部署方式成本高到不可行。已有参数高效方法（adapter、prefix 类）往往引入推理延迟或缩短可用序列长度，且常常达不到全量微调的质量。作者由此假设：模型适配时的权重变化具有很低的“内在秩”，可以把任务增量压缩成小得多的参数集合。"},"title":"LoRA: Low-Rank Adaptation of Large Language Models"},{"arxiv_id":"2210.03629","data":{"quotes":["a multi-hop question answering benchmark that requires reasoning over two or more Wikipedia passages","a fact verification benchmark where each claim is annotated SUPPORTS, REFUTES, or NOT ENOUGH INFO","which returns the first 5 sentences from the corresponding entity wiki page if it exists","we evaluate on 134 unseen evaluation games in a task-specific setup","a recently proposed online shopping website environment with 1.18M real-world products and 12k human instructions","This task is evaluated by average score (percentage of desired attributes covered by the chosen product averaged across all episodes) and success rate"],"text":"实验覆盖两类任务。知识密集型推理用 HotpotQA 多跳问答与 FEVER 事实核查，两者都采用只给问题/断言的 question-only 设定，模型必须通过作者自建的简易 Wikipedia API 交互取知识，该 API 只有 search、lookup、finish 三类动作，检索能力明显弱于当时的词法或神经检索器。交互式决策用 ALFWorld（134 个未见评估游戏，需在 50 多个地点中导航并操作物品）和 WebShop（118 万真实商品、1.2 万条人类指令的在线购物环境），后者按平均得分与成功率在 500 条测试指令上评估。"},"limitations":{"quotes":["such a structural constraint also reduces its flexibility in formulating reasoning steps, leading to more reasoning error rate than CoT","which counts for 23% of the error cases, derails the model reasoning and gives it a hard time to recover and reformulate thoughts","complex tasks with large action spaces require more demonstrations to learn well, which unfortunately can easily go beyond the input length limit of in-context learning","existing methods are still far from the performance of expert humans"],"text":"作者如实记录了 ReAct 的代价与边界。强制把推理切分到动作步骤之间虽然提高了事实性，却压缩了推理自由度，使 ReAct 在 HotpotQA 上的推理错误率高于 CoT；检索失败也是主要失分来源，占错误案例的 23%，模型一旦拿到无用观测就很难重新组织检索。此外，小模型仅靠提示难以同时学会推理与行动，需要数千条轨迹微调；而动作空间大的复杂任务需要更多示例，很容易超出上下文长度限制，整体效果仍明显落后于人类专家和有监督的专用系统。"},"method":{"quotes":["The idea of ReAct is simple: we augment the agent’s action space","For the tasks where reasoning is of primary importance (Figure 1(1)), we alternate the generation of thoughts and actions so that the task-solving trajectory consists of multiple thought-action-observation steps.","so we let the language model decide the asynchronous occurrence of thoughts and actions for itself","Each in-context example is a human trajectory of actions, thoughts, and environment observations to solve a task instance"],"text":"ReAct 的核心做法是把语言空间并入智能体的动作空间，让冻结的大模型在少样本上下文示例的提示下，交替生成“思考—动作—观测”三元组。作者没有引入额外的格式设计或示例筛选规则：每个上下文示例都是一条人类解题轨迹，思考与动作的出现密度按任务类型调整。对于推理为主的任务，模型被强制密集交替思考与动作；对于动作数量庞大的决策任务，则让模型自行决定异步插入稀疏思考。"},"metrics":[{"name":"HotpotQA EM (PaLM-540B, ReAct)","quote":"ReAct outperforms CoT on Fever (60.9 vs. 56.3) and slightly lags behind CoT on HotpotQA (27.4 vs. 29.4).","value":"27.4"},{"name":"FEVER accuracy (PaLM-540B, ReAct)","quote":"ReAct outperforms CoT on Fever (60.9 vs. 56.3) and slightly lags behind CoT on HotpotQA (27.4 vs. 29.4).","value":"60.9"},{"name":"ALFWorld success rate (best ReAct)","quote":"On ALFWorld, the best ReAct trial achieves an average success rate of 71%, significantly outperforming the best Act (45%) and BUTLER (37%) trials.","value":"71%"},{"name":"WebShop success rate gain (ReAct vs prior best)","quote":"ReAct achieves significantly better performance, with an absolute 10% improvement over the previous best success rate.","value":"+10% absolute"}],"problem":{"quotes":["their abilities for reasoning (e.g. chain-of-thought prompting) and acting (e.g. action plan generation) have primarily been studied as separate topics","reasoning traces help the model induce, track, and update action plans as well as handle exceptions, while actions allow it to interface with external sources, such as knowledge bases or environments, to gather additional information"],"text":"论文针对的问题是：LLM 的推理能力（如思维链提示）与行动能力（如动作规划生成）此前基本被当作两个独立课题研究，缺少让二者在同一条轨迹里互相支撑的机制。作者认为交错生成推理与动作能带来协同：推理帮助模型归纳、追踪和更新行动计划并处理异常，行动则让模型能查询知识库或环境以补充信息。这一问题在两处最突出——知识密集型推理中思维链容易凭空编造事实，交互式决策中纯动作策略缺少目标分解与常识引导。"},"title":"ReAct: Synergizing Reasoning and Acting in Language Models"},{"arxiv_id":"2303.18223","title":"A Survey of Large Language Models","problem":{"text":"语言建模旨在建模词序列的生成概率并预测后续 token，其研究从统计语言模型、神经语言模型一路演进到在大规模语料上预训练的 Transformer。研究者发现参数规模超过一定量级后，模型不仅性能显著提升，还会出现小模型不具备的能力，因此需要一个统一术语和系统梳理来界定“大语言模型”。本综述以参数规模明显偏大（正文以 10B 以上为主）的模型为对象，回顾其背景、关键发现与主流技术。","quotes":["Language is essentially a complex, intricate system of human expressions governed by grammatical rules.","To discriminate the difference in parameter scale, the research community has coined the term large language models (LLM) for the PLMs of significant size.","approaches to advancing language intelligence of machines."]},"method":{"text":"综述的组织方式本身就是其“方法”：围绕预训练、适配调优、使用、能力评估四个方面建立技术框架，再按此框架归纳代表性模型与做法。预训练部分讨论数据收集与预处理、模型架构、分布式训练与加速；后训练部分讨论指令微调与对齐调优（含 RLHF），并兼顾资源受限下的高效微调与量化；使用部分以提示设计为核心，涵盖上下文学习、思维链与规划。这一框架把分散的文献归入可比较的技术环节，而不是提出新模型或新算法。","quotes":["In particular, we focus on four major aspects of LLMs, namely pre-training, adaptation tuning, utilization, and capacity evaluation.","After pre-training or adaptation tuning, a major approach","method is in-context learning [50, 55], which formulates the"]},"data":{"text":"综述汇总了可复用的公开资源：模型 checkpoint 与 API、预训练语料与训练库，并统计了 Gemma-2、Qwen、LLaMA 等开源系列的参数规模、训练 token 量与算力开销。评测侧按语言生成、知识利用、复杂推理三类基本能力，加上更复杂的高级能力与各类基准来组织已有实证结果。作者同时强调，LLM 的研制与复现门槛很高，因此复用公开资源是现实路径。","quotes":["Besides, we also summarize the available resources for developing LLMs and discuss the remaining issues for future directions.","It is by no means an easy job to develop or reproduce LLMs,","surge of tasks and benchmarks have been proposed for","conducting empirical ability evaluation and analysis. In this"]},"limitations":{"text":"长上下文仍是短板：即便 GPT-4 Turbo 支持 128K、Claude 2.1 支持 200K token，模型仍难以充分利用窗口内信息，且架构探索被 decoder-only Transformer 主导。预训练层面，数据准备与训练流程缺乏可系统复现的细节，对算力和数据质量高度敏感；对齐层面依赖昂贵的人工反馈，幻觉与安全风险依旧突出。作为综述，本文的结论来自对既有文献的归纳，不提供新的实验证据。","quotes":["Turbo enables a long context of 128K tokens, and Claude","on training LLMs with decoder-only Transformers.","Model Training. For pre-training, it is essential to establish","RLHF heavily relies on high-quality human feedback","exhibit a tendency to generate hallucinations [640]"]},"metrics":[{"name":"Chinchilla 缩放律拟合的实验规模","value":"模型最大 16B 参数；数据 5B–500B tokens","quote":"16B) and data sizes (5B to 500B tokens), and fitted a similar"},{"name":"Qwen2.5 预训练 token 量","value":"18T tokens","quote":"is pre-trained on up to 18T tokens"},{"name":"Gemma-2 各尺寸预训练 token 量","value":"2T / 8T / 13T tokens（对应 2B/9B/27B）","quote":"2T, 8T, and 13T primarily English tokens, respectively"},{"name":"GPT-4 Turbo 上下文窗口","value":"128K tokens","quote":"Turbo enables a long context of 128K tokens, and Claude"}]},{"arxiv_id":"2605.23717","data":{"quotes":["All methods are evaluated independently over 500 landing trials.","Stewart platform (AKAZE) 177 39.55 3.39 59.32 97.74 3.50 ± 1.08","Pool (AKAZE) 53 3.77 7.54 90.57 98.11 2.90 ± 1.56","Finally, we perform extensive real-world experiments, demonstrating autonomous onboard landing using two different local feature extractors."],"text":"仿真在 ROS/Gazebo 中进行，与 MPC-NE 基线对比，并设预定义 5×5 AprilTag 布局（PD）与随机图案+A-KAZE（RD）两个变体，每种 5 个随机种子、各 500 次降落。真机在搭载 Jetson Orin Nano 的四旋翼上全机载运行（PX4 EKF2 状态估计、PX4 底层控制器、ROS 2 通信），同一策略在 Stewart 平台上切换 A-KAZE 与 SURF 两种特征提取器，共 358 次试验。随后把同一套流程不重训搬到泳池浮台上做 53 次试验，考察人工造浪下的泛化。"},"limitations":{"quotes":["Stewart platform (SURF) 181 41.44 4.97 57.46 96.13 4.95 ± 7.71","Ours (RD) 63.08 ± 11.26 36.92 ± 11.26 4.28 ± 1.62"],"text":"失效模式集中于触地姿态：Stewart 平台上倾角越界占 39.55%–41.44%，触地成功率仅 57%–59%，明显低于泳池浮台的 90.57%，说明平台运动越剧烈越难保证触地姿态。验证仍在受控环境（试验台与人工造浪泳池），训练用的平台运动为正弦叠加模型，与真实海况的不规则动力学存在差距。随机描述子变体成功率 63.08%、掎毁率 36.92%，对特征质量与数量敏感；方法还需平台始终处于下视相机视野内，且未估计平台状态，因此没有显式的安全保证。"},"method":{"quotes":["The proposed method uses multirotor state measurements together with local visual features, consisting of keypoints and associated descriptors extracted from the landing surface, to predict attitude and thrust commands.","The policy is trained in simulation using synthetic keypoints with randomly generated normalized descriptors, enabling zero-shot deployment with different local feature extractors onboard the UAV.","The policy is implemented as a Gaussian actor-critic","we use sparse local features"],"text":"把降落建模为 POMDP，策略直接把「当前/上一帧稀疏关键点+描述子、机体状态、上一动作」映射为姿态与推力指令，交给常规底层姿态控制器跟踪，部署时不观测也不估计平台状态。视觉端不用分割掩码或原始 RGB，而是用 SRPose 稀疏关键点编码器，描述子先做 L2 归一化，使匹配先验取决于方向而非幅值。训练时用合成关键点与随机生成的归一化描述子替代真实特征提取器，因此同一策略可零样本对接 SURF、A-KAZE 等不同提取器；策略为高斯 actor-critic（actor/critic 各为两层 512 单元 tanh MLP），在 Aerial Gym 中用 PPO 训练，并配合从静止平台起步的课程学习与 20% 描述子随机丢弃来提升鲁棒性。"},"metrics":[{"name":"Simulation success rate (Ours PD)","quote":"Ours (PD) 74.21 ± 3.93 25.79 ± 3.93 5.02 ± 2.28","value":"74.21%"},{"name":"Simulation success rate (MPC-NE baseline)","quote":"MPC-NE 48.60 51.40 9.06 ± 9.14","value":"48.60%"},{"name":"Real-world touchdown success, Stewart platform (AKAZE)","quote":"Stewart platform (AKAZE) 177 39.55 3.39 59.32 97.74 3.50 ± 1.08","value":"59.32%"},{"name":"Real-world touchdown success, pool (AKAZE)","quote":"Pool (AKAZE) 53 3.77 7.54 90.57 98.11 2.90 ± 1.56","value":"90.57%"}],"problem":{"quotes":["Autonomous landing of Unmanned Aerial Vehicles on maritime vessels is challenging due to the coupled motion of the vehicle and landing platform in open-sea conditions.","This paper presents a reinforcement-learning-based approach for autonomous multirotor landing on moving maritime platforms without requiring explicit platform-state observations or estimation during deployment.","To the best of our knowledge, this is the first approach for agile multirotor landing on maritime platforms in turbulent waters that does not rely on an explicit platform-state during deployment."],"text":"多旋翼在海上船只降落时，机体与平台同时运动、运动强耦合，是典型的困难场景；传统做法需要在部署时检测并预测平台运动（如视觉标记或平台状态估计），已有工作依赖显式平台状态。本文目标是只用无人机自身状态与降落面上的局部视觉特征，在部署阶段不做平台状态的显式观测或估计，也能快速完成降落。作者声称这是首个在湍流海况下不依赖显式平台状态的敏捷海上降落方法。"},"title":"Vision-Based Agile Landing on Turbulent Waters"},{"arxiv_id":"2610.03924","data":{"quotes":["Training is performed across 4096 parallel simulated environments, followed by fine-tuning in 16 environments with an onboard vision pipeline in the loop.","Across 31 motion-capture and 20 vision-based trials, the UAV landed every time, with median times to contact of 6.5 and 7.3 s","77% and 50% landed on the first attempt, with mean deck-relative speeds of 0.29 and 0.27 m/s"],"text":"训练在 4096 个并行仿真环境中完成，随后用 16 个环境做把机载视觉流水线放进回路的小规模微调；仿真基准以 1024 个环境、每个控制器约 10 500 次触地比较五种控制器（完整方法、去掉 CBF 奖励项、去掉 critic 未来甲板信息、PD、恒定下降）。实物实验用并联机械臂平台复现实测舰船升沉（峰峰值 0.70 m、平均周期 7.5 s），并配一台带机载相机的四旋翼，共完成 31 次动捕试验与 20 次视觉试验，全部成功降落。动捕下 97%、视觉下 95% 的切断推力时刻落在 0.5 m/s 判据内，首次尝试成功率分别为 77% 与 50%，到首次接触的中位时间为 6.5 s 与 7.3 s。"},"limitations":{"quotes":["Vision-in-the-loop fine-tuning did little to close the sensing gap.","intervention was caused by the lagged velocity estimate alone","so every intervention came early.","Because the autopilot's disarm logic cannot detect the vehicle resting on a moving deck, proximity-based thrust cutoff at touchdown is commanded directly in the landing pipeline."],"text":"实验台只能复现甲板运动学本身，没有风、甲板空气尾流，也没有完整的六自由度海况，且室内可飞行程受甲板位移限制。CBF 只覆盖甲板相对垂直通道并依赖假设的刹车加速度上界，实机上其输入会延迟甚至失效，因此滤波器给出的保证只对“它拿到的状态”成立，作者把估计器时延与有效性的处理留作未来工作。视觉链路确实暴露了这一弱点：视觉垂直速度估计滞后动捕约 0.49 s，10 次视觉试验中的拦截全部是提前触发（真实裕度仍为正），其中 8 次纯粹由滞后估计导致；把相机渲染与检测器放进训练回路又受吞吐限制，只扩到 16 个环境，几乎没能缩小感知差距。"},"method":{"quotes":["the critic sees 6 s of future deck height during training","a 17-dimensional state made of the vehicle's position, velocity and attitude relative to the deck and outputs world-frame velocity and yaw-rate commands","A control-barrier-function (CBF) stopping margin on the deck-relative vertical state is incorporated at two stages","wraps the deployed policy in an outer loop and checks the vertical velocity it commands at every tick"],"text":"策略侧采用非对称 actor–critic 的循环网络：actor 每个 20 Hz 步只接收 17 维甲板相对状态（位置、速度、姿态四元数、机体系重力、上一帧指令），经两层 GRU（128、64）与 32 单元 ELU MLP 输出世界系速度与偏航角速度指令，复用飞控自身的速度设定点接口；critic 在训练时额外看到未来 6 s 的甲板高度（以及相对角速度等特权信息），从而在不改变机上可得信息的前提下降低方差。CBF 停止裕度在两处使用：训练时作为奖励项对 max(0, −h)/0.25 m 施加 Huber 罚，迫使策略保留刹车余量；部署时作为 20 Hz 外层安全滤波器检查甲板相对垂直状态，一旦裕度不足或连续三拍违反 class-K 条件就接管指令、爬升到悬停高度保持后重新下降。触地时则直接在降落流水线中按接近度切断推力，绕开无法感知“停在运动甲板上”的自动上锁逻辑。"},"metrics":[{"name":"Landing success (mocap/vision trials)","quote":"Across 31 motion-capture and 20 vision-based trials, the UAV landed every time","value":"31/31, 20/20"},{"name":"First-attempt landing rate","quote":"77% and 50% landed on the first attempt, with mean deck-relative speeds of 0.29 and 0.27 m/s","value":"77% (mocap) / 50% (vision)"},{"name":"Median time to first contact","quote":"with median times to contact of 6.5 and 7.3 s","value":"6.5 s (mocap) / 7.3 s (vision)"},{"name":"Deck emulator heave","quote":"(scaled to 0.70 m peak-to-peak, 7.5 s mean period)","value":"0.70 m peak-to-peak, 7.5 s mean period"},{"name":"Mean deck-relative speed at thrust cutoff","quote":"with mean deck-relative speeds of 0.29 and 0.27 m/s, respectively, at the instant of thrust cutoff","value":"0.29 m/s (mocap) / 0.27 m/s (vision)"}],"problem":{"quotes":["This paper addresses autonomous landing of unmanned aerial vehicle (UAV) rotorcrafts on a heaving ship deck using a recurrent policy trained via asymmetric actor-critic reinforcement learning","No future deck motion is available at deployment, so the descent decision comes from the observation history alone, commands world-frame velocity and yaw rate."],"text":"论文研究四旋翼无人机在起伏（heave）舰船甲板上的自主降落：甲板只做升沉运动，且降落时无法预知甲板未来的运动轨迹，因此下降时机只能从观测历史中推断，构成部分可观测的有限时域问题。难点在于既要对准甲板中心并保持水平姿态，又要在剩余高度内把甲板相对垂直速度降到安全范围，否则会以过大相对速度触地。作者把该问题同时当作学习问题与在线安全性问题来处理，并强调其贡献是工程组合与实机验证，而非新的安全学习理论。"},"title":"Barrier-Shaped Recurrent Reinforcement Learning for Autonomous Landing on a Heaving Ship Deck"}],"papers":{"1706.03762":{"pages":15,"figures":[{"file":"f01.png","page":3,"w":1520,"h":2239},{"file":"f02.png","page":4,"w":835,"h":1282},{"file":"f03.png","page":4,"w":445,"h":884}]},"1706.06978":{"pages":9,"figures":[{"file":"f01.png","page":9,"w":2423,"h":1418},{"file":"f02.png","page":9,"w":2806,"h":918},{"file":"f03.png","page":3,"w":1094,"h":547}]},"1810.04805":{"pages":16,"figures":[{"file":"p013.jpg","page":13,"w":0,"h":0},{"file":"p015.jpg","page":15,"w":0,"h":0}]},"2005.11401":{"pages":19,"figures":[{"file":"f01.png","page":17,"w":2114,"h":810}]},"2106.09685":{"pages":26,"figures":[{"file":"p026.jpg","page":26,"w":0,"h":0},{"file":"p012.jpg","page":12,"w":0,"h":0}]},"2210.03629":{"pages":33,"figures":[{"file":"p002.jpg","page":2,"w":0,"h":0},{"file":"p014.jpg","page":14,"w":0,"h":0}]},"2303.18223":{"pages":144,"figures":[{"file":"f01.png","page":9,"w":974,"h":1030},{"file":"f02.jpg","page":9,"w":995,"h":995},{"file":"f03.png","page":17,"w":1262,"h":766},{"file":"f04.png","page":12,"w":752,"h":1093},{"file":"f05.jpg","page":12,"w":684,"h":661},{"file":"f06.jpg","page":9,"w":640,"h":640}]},"2605.23717":{"pages":8,"figures":[{"file":"f01.jpg","page":3,"w":1280,"h":960},{"file":"f02.jpg","page":3,"w":1280,"h":960},{"file":"f03.jpg","page":5,"w":1000,"h":616},{"file":"f04.jpg","page":1,"w":400,"h":712},{"file":"f05.jpg","page":1,"w":400,"h":712},{"file":"f06.jpg","page":1,"w":400,"h":712}]},"2610.03924":{"pages":8,"figures":[{"file":"f01.png","page":1,"w":1472,"h":705},{"file":"f02.png","page":1,"w":1445,"h":705},{"file":"f03.png","page":1,"w":1200,"h":800},{"file":"f04.png","page":3,"w":1315,"h":707},{"file":"f05.jpg","page":6,"w":610,"h":593},{"file":"f06.jpg","page":6,"w":600,"h":600}]}}}
const params = new URLSearchParams(location.search)
const requested = params.get('id')
const note = DATA.notes.find(n => n.arxiv_id === requested) || DATA.notes[0]
const paper = DATA.papers[note.arxiv_id]
let pageNum = 1

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
}
function clause(s, n) {
  const t = String(s).replace(/\s+/g, ' ').trim()
  const cut = t.split(/[。；]/)[0] || t
  return cut.length <= n ? cut : cut.slice(0, n) + '…'
}
function singlePercent(value) {
  const marks = String(value).match(/%/g)
  if (!marks || marks.length !== 1) return null
  const m = String(value).match(/(\d+(?:\.\d+)?)\s*%/)
  if (!m) return null
  const num = Number(m[1])
  return num >= 0 && num <= 100 ? num : null
}
function pad(n) { return String(n).padStart(3, '0') }
function pageSrc(n) { return 'assets/papers/' + note.arxiv_id + '/p' + pad(n) + '.jpg' }

const branches = [
  ['问题', clause(note.problem.text, 46)],
  ['方法', clause(note.method.text, 46)],
  ['数据', clause(note.data.text, 46)],
  ['指标', note.metrics.slice(0, 2).map(m => m.value).join(' · ') || '—'],
  ['局限', clause(note.limitations.text, 46)],
]
const meters = note.metrics.map(m => {
  const pct = singlePercent(m.value)
  const bar = pct == null ? '' : '<i style="width:' + pct + '%"></i>'
  return '<div class="meter">' + bar + '<b>' + esc(m.value) + '</b><span>' + esc(m.name) + '</span><blockquote>' + esc(m.quote) + '</blockquote></div>'
}).join('')
const figs = (paper.figures || []).map(fig =>
  '<button type="button" class="fig" data-page="' + fig.page + '"><img src="assets/papers/' + note.arxiv_id + '/' + fig.file + '" alt="第 ' + fig.page + ' 页插图"><span>第 ' + fig.page + ' 页</span></button>'
).join('')
const figBlock = figs
  ? '<h2>论文里的图</h2><p class="lead">从 PDF 里抽出的较大插图。点一张，左边翻到它所在的那一页。</p><div class="figs">' + figs + '</div>'
  : ''

function field(title, block, anchor) {
  const quotes = (block.quotes || []).map(q => '<blockquote>' + esc(q) + '</blockquote>').join('')
  return '<div id="' + anchor + '"><h2>' + title + '</h2><p>' + esc(block.text) + '</p>' + quotes + '</div>'
}

document.title = note.arxiv_id + ' · 对照阅读'
document.getElementById('note').innerHTML =
  '<p class="kicker">arXiv ' + esc(note.arxiv_id) + ' · ' + paper.pages + ' 页</p>' +
  '<h1>' + esc(note.title) + '</h1>' +
  '<div class="map" aria-label="笔记思维导图">' +
    '<div class="map-side">' +
      branches.slice(0, 2).map((b, i) => '<a class="twig" href="#sec-' + i + '"><b>' + b[0] + '</b><span>' + esc(b[1]) + '</span></a>').join('') +
    '</div>' +
    '<div class="map-core">' + esc(clause(note.title, 42)) + '</div>' +
    '<div class="map-side">' +
      branches.slice(2).map((b, i) => '<a class="twig" href="#sec-' + (i + 2) + '"><b>' + b[0] + '</b><span>' + esc(b[1]) + '</span></a>').join('') +
    '</div>' +
  '</div>' +
  figBlock +
  '<h2>指标</h2><div class="meters">' + meters + '</div>' +
  field('问题', note.problem, 'sec-0') +
  field('方法', note.method, 'sec-1') +
  field('数据', note.data, 'sec-2') +
  '<div id="sec-3"></div>' +
  field('局限', note.limitations, 'sec-4')

const img = document.getElementById('page')
const pager = document.getElementById('pager')
const jump = document.getElementById('jump')
jump.max = String(paper.pages)

function show(n) {
  pageNum = Math.min(paper.pages, Math.max(1, n))
  img.src = pageSrc(pageNum)
  pager.textContent = pageNum + ' / ' + paper.pages
  jump.value = String(pageNum)
}
document.getElementById('prev').onclick = () => show(pageNum - 1)
document.getElementById('next').onclick = () => show(pageNum + 1)
jump.onchange = () => show(Number(jump.value))
document.querySelectorAll('.fig').forEach(btn => {
  btn.onclick = () => show(Number(btn.dataset.page))
})
document.addEventListener('keydown', ev => {
  if (ev.target === jump) return
  if (ev.key === 'ArrowLeft') show(pageNum - 1)
  if (ev.key === 'ArrowRight') show(pageNum + 1)
})
show(1)
</script>

</html>
